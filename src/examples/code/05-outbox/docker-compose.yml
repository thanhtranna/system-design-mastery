version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
      POSTGRES_DB: outbox
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outbox"]
      interval: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  order-service:
    build:
      context: .
      dockerfile: cmd/order-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://outbox:outbox@postgres:5432/outbox?sslmode=disable
    ports:
      - "8080:8080"

  outbox-relay:
    build:
      context: .
      dockerfile: cmd/outbox-relay/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DATABASE_URL: postgres://outbox:outbox@postgres:5432/outbox?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      POLL_INTERVAL_MS: "500"
      BATCH_SIZE: "100"

  order-events-consumer:
    build:
      context: .
      dockerfile: cmd/order-events-consumer/Dockerfile
    depends_on:
      kafka:
        condition: service_started
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://outbox:outbox@postgres:5432/outbox?sslmode=disable
